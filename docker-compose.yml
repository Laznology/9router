services:
  9router:
    # Own GHCR build (Laznology fork) instead of upstream decolua/9router:latest.
    image: ghcr.io/laznology/9router:latest
    container_name: 9router
    restart: always
    ports:
      - "20128:20128"
    volumes:
      # Existing instance mounts the host data dir directly (docker inspect of
      # the previous 9router container). Do NOT switch back to a named volume:
      # all provider connections / API keys / usage history live in ~/.9router
      # and a fresh named volume would look like data loss to the app.
      - ~/.9router:/app/data
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      # Same value the previous container ran with; backend has no stored hash
      # yet, so dropping it would lock remote dashboard logins.
      INITIAL_PASSWORD: "123456"
