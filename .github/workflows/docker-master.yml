name: Build and Push Master Image

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/docker-master.yml"
      - "Dockerfile"
      - ".dockerignore"
      - "package.json"
      - "next.config.mjs"
      - "custom-server.js"
      - "open-sse/**"
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "cli/**"
  workflow_dispatch:

# Serialize with release publishing so two runs cannot move latest backwards.
concurrency:
  group: docker-publish-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  build:
    name: Build and publish latest
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out master
        uses: actions/checkout@v4

      - name: Resolve image and version
        id: meta
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="$(node -p "require('./package.json').version")"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push latest
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.image }}:latest
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            ALPINE_MIRROR=${{ vars.ALPINE_MIRROR || 'dl-cdn.alpinelinux.org' }}
            NPM_REGISTRY=${{ vars.NPM_REGISTRY || 'https://registry.npmjs.org/' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=9router-amd64
          cache-to: type=gha,mode=max,scope=9router-amd64
          provenance: false
          sbom: false

      - name: Smoke-test published latest
        env:
          IMAGE: ${{ steps.meta.outputs.image }}:latest
        run: |
          set -Eeuo pipefail
          container="9router-master-smoke-${GITHUB_RUN_ID}"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT

          docker pull "$IMAGE"
          docker run --detach \
            --name "$container" \
            --platform linux/amd64 \
            --publish 20128:20128 \
            "$IMAGE"

          for attempt in {1..45}; do
            if curl --fail --silent --show-error http://127.0.0.1:20128/api/health; then
              echo "Published latest health check passed"
              exit 0
            fi
            if (( attempt % 5 == 0 )); then
              echo "Waiting for published latest health check (${attempt}/45)" >&2
            fi
            sleep 2
          done

          echo "Published latest health check failed; container logs follow:" >&2
          docker logs "$container" || true
          exit 1
